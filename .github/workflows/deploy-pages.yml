name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'links/**'
      - 'index.md'
      - 'images/**'
      - 'memes.md'
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  cleanup:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Cleanup old workflow runs (keep latest 10)
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflow_id = 'deploy-pages.yml';
            const keep = 10;

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns, {owner, repo, workflow_id, per_page: 100},
              (response) => response.data.workflow_runs
            );

            const oldRuns = runs.slice(keep);
            core.info(`Found ${runs.length} runs. Deleting ${oldRuns.length} old runs.`);

            for (const run of oldRuns) {
              await github.rest.actions.deleteWorkflowRun({owner, repo, run_id: run.id});
              core.info(`Deleted run ${run.id} from ${run.created_at}`);
            }
